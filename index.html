<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="description" content="Company chatbot WebUI" />
    <title>Company Chatbot</title>
    <script>
      try {
        var stored = localStorage.getItem('chatbot-theme')
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        var loc = localStorage.getItem('chatbot-locale')
        if (loc !== 'en' && loc !== 'fa') {
          loc = (navigator.language || '').toLowerCase().indexOf('fa') === 0 ? 'fa' : 'en'
        }
        document.documentElement.lang = loc
        document.documentElement.dir = loc === 'fa' ? 'rtl' : 'ltr'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
